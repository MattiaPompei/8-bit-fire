<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Splash</title>
<style>
html, body { margin: 0; }
body { background: var(--panel); padding: 16px; }
body { padding: 0; } .splash { position: relative; width: 300px; height: 500px; background: var(--stage); display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); justify-items: center; overflow: hidden; } .splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; } .veil { position: absolute; inset: 0; background: var(--veil); } .ef-title { position: relative; align-self: start; margin-top: calc(500px / 3 - 14px); font-size: 28px; } .info { position: absolute; top: 16px; right: 16px; } .ef-primary { position: relative; margin-bottom: var(--space-24); }
</style>
</head>
<body class="ef">
<div class="splash">
  <canvas id="f" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <button class="ef-btn ef-btn-2 ef-glass info" type="button" aria-label="Controlli"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  <h1 class="ef-title">8-bit fire</h1>
  <button class="ef-btn ef-primary is-start" type="button">Accendi il fuoco</button>
</div>
<script>
function firePalette() {
  var cs = getComputedStyle(document.documentElement), out = [];
  for (var i = 0; i <= 36; i++) {
    var v = cs.getPropertyValue('--fire-' + (i < 10 ? '0' : '') + i).trim() || '#070707';
    var n = parseInt(v.replace('#', ''), 16);
    out.push(((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0);
  }
  return out;
}
function startFire(cv, cell, level, wind) {
  var W = Math.ceil(cv.clientWidth / cell), H = Math.ceil(cv.clientHeight / cell);
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
  var c = new Uint8Array(W * H), pal = firePalette(), b = Math.round(36 * level / 10);
  var d = 36 / H, n = d <= 1.4 ? 2 : Math.ceil(d / 0.7), p = Math.min(1, d / n);
  function step() {
    for (var x = 0; x < W; x++) c[(H - 1) * W + x] = b;
    for (var y = 0; y < H - 1; y++) for (var x2 = 0; x2 < W; x2++) {
      var r = 0; for (var k = 0; k < n; k++) if (Math.random() < p) r++;
      var v = c[(y + 1) * W + x2], tx = x2 + wind * r;
      while (tx < 0) tx += W; while (tx >= W) tx -= W;
      c[y * W + tx] = v > r ? v - r : 0;
    }
  }
  function draw() { for (var i = 0; i < c.length; i++) px[i] = pal[c[i]]; ctx.putImageData(img, 0, 0); }
  for (var i = 0; i < H; i++) step();
  draw();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(function () { step(); draw(); }, 50);
}
startFire(document.getElementById('f'), 6, 7, -1);</script>
</body>
</html>
