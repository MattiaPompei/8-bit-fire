<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>WindSelector</title>
<style>
html, body { margin: 0; }
body { background: var(--panel); padding: 16px; }
.stack { display: grid; gap: 16px; max-width: 448px; }
</style>
</head>
<body class="ef">
<div class="stack">
  <div class="ef-row"><div class="ef-meta"><span class="ef-key">Vento</span><output class="ef-value">Sinistra</output></div>
    <div class="ef-wind" role="radiogroup" aria-label="Vento"><button class="ef-btn ef-btn-2" role="radio" aria-checked="true" type="button" aria-label="Verso sinistra"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="ef-btn ef-btn-2" role="radio" aria-checked="false" type="button" aria-label="Fermo, fiamme dritte"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button><button class="ef-btn ef-btn-2" role="radio" aria-checked="false" type="button" aria-label="Verso destra"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
  <div class="ef-row"><div class="ef-meta"><span class="ef-key">Vento</span><output class="ef-value">Nessuno</output></div>
    <div class="ef-wind" role="radiogroup" aria-label="Vento, disattivato"><button class="ef-btn ef-btn-2" role="radio" aria-checked="false" disabled type="button" aria-label="Verso sinistra"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="ef-btn ef-btn-2" role="radio" aria-checked="false" disabled type="button" aria-label="Fermo, fiamme dritte"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button><button class="ef-btn ef-btn-2" role="radio" aria-checked="false" disabled type="button" aria-label="Verso destra"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
</div>

</body>
</html>
